<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My App UTS</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      background-color: #ffffff;
      color: #333333;
    }

   
    header {
      background-color: #00d2ff;
      color: #ffffff;
      padding: 12px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header .logo {
      font-size: 1rem;
      font-weight: bold;
    }

    header nav a {
      color: #ffffff;
      text-decoration: none;
      margin-left: 15px;
      font-size: 0.85rem;
      opacity: 0.9;
    }

    header nav a:hover {
      opacity: 1;
      text-decoration: underline;
    }

   
    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
    }

    .container {
      width: 100%;
      max-width: 480px;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 600;
      color: #2c3e50;
      margin-bottom: 20px;
      text-align: center;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      color: #666666;
      margin-bottom: 6px;
    }

    .form-group input, 
    .form-group select {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #e0e0e0;
      border-radius: 5px;
      font-size: 0.9rem;
      outline: none;
      background-color: #ffffff;
      color: #333333;
    }

    .form-group input:focus, 
    .form-group select:focus {
      border-color: #00d2ff;
    }

    .btn-hitung {
      background-color: #007bff; /* Warna biru tombol */
      color: #ffffff;
      border: none;
      padding: 8px 18px;
      border-radius: 6px;
      font-size: 0.9rem;
      cursor: pointer;
      margin-top: 5px;
    }

    .btn-hitung:hover {
      background-color: #0056b3;
    }

    .result-box {
      margin-top: 20px;
      padding: 10px;
      border-radius: 5px;
      background-color: #f8f9fa;
      border: 1px solid #e9ecef;
      font-size: 0.95rem;
      font-weight: bold;
      display: none;
    }

    
    footer {
      background-color: #00d2ff; /* Warna biru terang/cyan */
      color: #ffffff;
      text-align: center;
      padding: 10px;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="logo">My App UTS</div>
    <nav>
      <a href="#">Home</a>
      <a href="#">About</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <!-- KONTEN UTAMA -->
  <main>
    <div class="container">
      <h1>Operasi Matematika dengan JavaScript</h1>

      <div class="form-group">
        <label for="num1">Angka Pertama</label>
        <input type="number" id="num1" placeholder="">
      </div>

      <div class="form-group">
        <label for="num2">Angka Kedua</label>
        <input type="number" id="num2" placeholder="">
      </div>

      <div class="form-group">
        <label for="operator">Operasi</label>
        <select id="operator">
          <option value="+">Penjumlahan</option>
          <option value="-">Pengurangan</option>
          <option value="*">Perkalian</option>
          <option value="/">Pembagian</option>
          <option value="%">Modulus</option>
        </select>
      </div>

      <button type="button" class="btn-hitung" onclick="hitungHasil()">Hitung</button>

      <div class="result-box" id="resultContainer">
        Hasil: <span id="resultValue">0</span>
      </div>
    </div>
  </main>

  <!-- FOOTER -->
  <footer>
    &copy; 2026 My App. All Rights Reserved.
  </footer>

  <!-- LOGIKA JAVASCRIPT -->
  <script>
    function hitungHasil() {
      const num1Val = document.getElementById('num1').value;
      const num2Val = document.getElementById('num2').value;
      const operator = document.getElementById('operator').value;
      const resultContainer = document.getElementById('resultContainer');
      const resultValue = document.getElementById('resultValue');

      if (num1Val === "" || num2Val === "") {
        alert("Harap masukkan angka pertama dan angka kedua!");
        return;
      }

      const num1 = parseFloat(num1Val);
      const num2 = parseFloat(num2Val);
      let hasil = 0;

      switch (operator) {
        case '+':
          hasil = num1 + num2;
          break;
        case '-':
          hasil = num1 - num2;
          break;
        case '*':
          hasil = num1 * num2;
          break;
        case '/':
          if (num2 === 0) {
            alert("Tidak dapat melakukan pembagian dengan angka 0!");
            return;
          }
          hasil = num1 / num2;
          break;
        case '%':
          hasil = num1 % num2;
          break;
      }

      resultValue.textContent = hasil;
      resultContainer.style.display = 'block';
    }
  </script>

</body>
</html>
